<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>Unity WebGL Player | Web_TFGPro</title>
    <link rel="shortcut icon" href="TemplateData/favicon.ico">
    <link rel="stylesheet" href="TemplateData/style.css">
    <link rel="manifest" href="manifest.webmanifest">
    <script src="TemplateData/ConvaiWebGLSDK.js"></script>
  </head>
  <body>
    <div id="unity-container">
      <canvas id="unity-canvas" width=960 height=600 tabindex="-1"></canvas>
      <div id="unity-loading-bar">
        <div id="unity-logo"></div>
        <div id="unity-progress-bar-empty">
          <div id="unity-progress-bar-full"></div>
        </div>
      </div>
      <div id="unity-warning"> </div>
    </div>
    <script>
      function getUrlParams() {
        const params = new URLSearchParams(window.location.search);
        return {
          jobId: params.get('jobId'),
          jobTitle: params.get('jobTitle'),
          jobDescription: params.get('jobDescription'),
          jobSkills: params.get('jobSkills'),
          jobExperience: params.get('jobExperience')
        };
      }

      function sendJobIdToUnity(unityInstance, jobId) {
        if (!jobId) {
          console.warn('No jobId available to send to Unity');
          return;
        }
        console.log('Sending jobId to Unity:', jobId);
        unityInstance.SendMessage('InterviewManager', 'SetJobId', jobId);
      }

      window.addEventListener('error', function (event) {
        console.error('Window error:', event.message, event.filename, event.lineno, event.colno, event.error);
      });

      window.addEventListener("load", function () {
        if ("serviceWorker" in navigator) {
          navigator.serviceWorker.register("ServiceWorker.js").catch(function (err) {
            console.warn('ServiceWorker registration failed:', err);
          });
        }
      });

      var container = document.querySelector("#unity-container");
      var canvas = document.querySelector("#unity-canvas");
      var loadingBar = document.querySelector("#unity-loading-bar");
      var progressBarFull = document.querySelector("#unity-progress-bar-full");
      var warningBanner = document.querySelector("#unity-warning");

      function unityShowBanner(msg, type) {
        function updateBannerVisibility() {
          warningBanner.style.display = warningBanner.children.length ? 'block' : 'none';
        }
        var div = document.createElement('div');
        div.innerHTML = msg;
        warningBanner.appendChild(div);
        if (type == 'error') div.style = 'background: red; padding: 10px;';
        else {
          if (type == 'warning') div.style = 'background: yellow; padding: 10px;';
          setTimeout(function() {
            warningBanner.removeChild(div);
            updateBannerVisibility();
          }, 5000);
        }
        updateBannerVisibility();
      }

      var buildUrl = "Build";
      var loaderUrl = buildUrl + "/CareerCoach.loader.js";
      var config = {
        dataUrl: buildUrl + "/CareerCoach.data",
        frameworkUrl: buildUrl + "/CareerCoach.framework.js",
        codeUrl: buildUrl + "/CareerCoach.wasm",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "DefaultCompany",
        productName: "Web_TFGPro",
        productVersion: "0.1.0",
        showBanner: unityShowBanner,
      };

      if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
        var meta = document.createElement('meta');
        meta.name = 'viewport';
        meta.content = 'width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes';
        document.getElementsByTagName('head')[0].appendChild(meta);
      }

      loadingBar.style.display = "block";

      var params = getUrlParams();
      console.log('CareerCoach URL params:', params);

      var script = document.createElement("script");
      script.src = loaderUrl;
      script.onload = () => {
        console.log('CareerCoach loader script loaded:', loaderUrl);
        createUnityInstance(canvas, config, (progress) => {
          progressBarFull.style.width = 100 * progress + "%";
        }).then((unityInstance) => {
          loadingBar.style.display = "none";
          sendJobIdToUnity(unityInstance, params.jobId);
        }).catch((message) => {
          console.error('Unity error:', message);
          alert('Failed to load Career Coach: ' + message);
        });
      };
      script.onerror = function () {
        console.error('Failed to load loader script:', loaderUrl);
        alert('Failed to load Career Coach loader script.');
      };
      document.body.appendChild(script);
    </script>
  </body>
</html>
