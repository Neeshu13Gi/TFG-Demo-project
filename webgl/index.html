<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>Unity WebGL Player | Web_TFGPro</title>
    <link rel="shortcut icon" href="TemplateData/favicon.ico">
    <link rel="stylesheet" href="TemplateData/style.css">
    <link rel="manifest" href="manifest.webmanifest">
    <script src="TemplateData/ConvaiWebGLSDK.js"></script>
  </head>
  <body>
    <div id="unity-container">
      <canvas id="unity-canvas" width=960 height=600 tabindex="-1"></canvas>
      <div id="unity-loading-bar">
        <div id="unity-logo"></div>
        <div id="unity-progress-bar-empty">
          <div id="unity-progress-bar-full"></div>
        </div>
      </div>
      <div id="unity-warning"> </div>
    </div>
   <script>
// =====================
// FETCH INTERCEPTOR - MUST be first!
// When running locally, Unity may still call the production API URL.
// Rewrite production origin to same-origin so reports save locally.

(() => {
  const isLocalHost =
    window.location.hostname === "localhost" ||
    window.location.hostname === "127.0.0.1" ||
    window.location.hostname === "0.0.0.0";

  if (!isLocalHost) return;

  const PROD_ORIGINS = [
    "https://tfg.metaverse911.in/api",
    "https://tfg.metaverse911.in",
    "https://tfg-demo-project.onrender.com"
  ];

  const rewriteUrl = (input) => {
    try {
      let rawUrl = "";

      if (typeof input === "string") {
        rawUrl = input;
      } else if (input instanceof URL) {
        rawUrl = input.href;
      } else if (input && typeof input === "object") {
        if (typeof input.url === "string") rawUrl = input.url;
        else if (typeof input.href === "string") rawUrl = input.href;
        else if (typeof input.target === "string") rawUrl = input.target;
      }

      if (!rawUrl) return input;

      const trimmed = rawUrl.trim();
      const repaired = trimmed
        .replace(/^https:\/\/(?!\/)/i, "https://")
        .replace(/^http:\/\/(?!\/)/i, "http://")
        .replace(/^https:\/(?!\/)/i, "https://")
        .replace(/^http:\/(?!\/)/i, "http://");

      if (/^https?:\/\//i.test(repaired)) {
        const parsed = new URL(repaired);
        const isProductionUrl = PROD_ORIGINS.some((origin) => {
          try {
            return parsed.origin === origin || parsed.hostname === new URL(origin).hostname;
          } catch {
            return false;
          }
        });

        if (isProductionUrl) {
          const localPath = parsed.pathname.replace(/^\/api(?=\/|$)/, "").replace(/\/+/g, "/") || "/";
          return `${window.location.origin}${localPath}${parsed.search}${parsed.hash}`;
        }

        return repaired;
      }

      if (repaired.startsWith("//")) {
        const normalizedRelativePath = repaired.replace(/\/+/g, "/").replace(/^\/+/, "/");
        return `${window.location.origin}${normalizedRelativePath}`;
      }

      if (repaired.startsWith("/users/profile") || repaired.startsWith("/modules")) {
        return `${window.location.origin}${repaired}`;
      }

      return input;
    } catch {
      return input;
    }
  };

  const originalFetch = window.fetch?.bind(window);
  if (originalFetch) {
    window.fetch = function (input, init) {
      const rewrittenInput = rewriteUrl(input);

      if (input instanceof Request && rewrittenInput !== input) {
        return originalFetch(new Request(rewrittenInput, {
          method: input.method,
          headers: input.headers,
          body: input.body,
          mode: input.mode,
          credentials: input.credentials,
          cache: input.cache,
          redirect: input.redirect,
          referrer: input.referrer,
          integrity: input.integrity,
          keepalive: input.keepalive
        }), init);
      }

      return originalFetch(rewrittenInput, init);
    };
  }

  const OriginalXHR = window.XMLHttpRequest;
  if (OriginalXHR) {
    const xhrProto = OriginalXHR.prototype;
    const originalOpen = xhrProto.open;
    xhrProto.open = function (method, url, ...rest) {
      return originalOpen.call(this, method, rewriteUrl(url), ...rest);
    };
  }
})();


let unityInstanceGlobal = null;

function getParam(key) {
  return new URLSearchParams(window.location.search).get(key);
}

function unityShowBanner(msg, type) {
  const warningBanner = document.querySelector("#unity-warning");
  if (!warningBanner) return;

  const div = document.createElement("div");
  div.innerHTML = msg;
  div.style = type === "error"
    ? "background:red;padding:10px;"
    : "background:yellow;padding:10px;";

  warningBanner.appendChild(div);

  if (type !== "error") {
    setTimeout(() => {
      if (warningBanner.contains(div)) {
        warningBanner.removeChild(div);
      }
    }, 5000);
  }
}

const buildUrl = "Build";
const loaderUrl = buildUrl + "/TFGWeb(20-02-26).loader.js";

const config = {
  dataUrl: buildUrl + "/TFGWeb(20-02-26).data",
  frameworkUrl: buildUrl + "/TFGWeb(20-02-26).framework.js",
  codeUrl: buildUrl + "/TFGWeb(20-02-26).wasm",
  streamingAssetsUrl: "StreamingAssets",
  companyName: "DefaultCompany",
  productName: "Web_TFGPro",
  productVersion: "0.1.0",
  showBanner: unityShowBanner,
};

const script = document.createElement("script");
script.src = loaderUrl;

script.onload = () => {
  createUnityInstance(document.querySelector("#unity-canvas"), config, (progress) => {
    document.querySelector("#unity-progress-bar-full").style.width = (progress * 100) + "%";
  }).then((unityInstance) => {

    unityInstanceGlobal = unityInstance;
    console.log("✅ Unity Ready");

    // =========================
    // GET DATA FROM URL
    // =========================
    const token = getParam("token");
    const name = getParam("name") || "";
console.log("TOKEN VALUE:", token);

    const moduleId = getParam("moduleId");
    const moduleIndex = getParam("module") ? parseInt(getParam("module")) : null;
    const subIndex = getParam("sub") ? parseInt(getParam("sub")) : null;

    console.log("👤 Name:", name);
    console.log("🔑 Token:", token);
    console.log("📦 ModuleId:", moduleId);

    if (!token) {
      console.warn("⚠️ No token found, stopping");
      return;
    }

    const jsonData = JSON.stringify({
      token: token,
     name: name,
      moduleId: moduleId
    });

    // =========================
    // 🔥 SAFE SEND (RETRY)
    // =========================
    let attempts = 0;

    const sendInterval = setInterval(() => {
      attempts++;

      try {
        unityInstance.SendMessage(
          "AppFlowManager",
          "SetUserDataFromWebsite",
          jsonData
        );

        console.log("🚀 Sent USER DATA:", jsonData);

        // ---- AFTER USER DATA → LOAD MODULE ----
        setTimeout(() => {

          if (moduleId) {
            unityInstance.SendMessage(
              "AppFlowManager",
              "OpenMainModuleById",
              moduleId
            );
          } else if (moduleIndex !== null) {
            unityInstance.SendMessage(
              "AppFlowManager",
              "OpenMainModuleFromWebsite",
              moduleIndex
            );
          }

          if (subIndex !== null) {
            unityInstance.SendMessage(
              "AppFlowManager",
              "SetWebZoneIndex",
              subIndex
            );
          }

        }, 500);

        clearInterval(sendInterval);

      } catch (e) {
        console.log("⏳ Retry sending.... Attempt:", attempts);

        if (attempts >= 5) {
          clearInterval(sendInterval);
          console.error("❌ Failed to send data to Unity");
        }
      }

    }, 1000);

  });
};

document.body.appendChild(script);
</script>
  </body>
</html>
